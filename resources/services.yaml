---
apiVersion: v1
kind: Service
metadata:
  name: jellystat
  namespace: jellystat
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: jellystat
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jellystat
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: postgres
  selector:
    app: postgres

