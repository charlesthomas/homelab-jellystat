---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jellystat

commonAnnotations:
  repo: https://github.com/charlesthomas/homelab-jellystat
commonLabels:
  app: jellystat

images:
  - name: jellystat
    newName: docker.io/cyfershepard/jellystat
    newTag: 1.1.8
  - name: postgres
    newTag: "18.3"

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: all
      namespace: jellystat
      annotations:
        reloader.stakater.com/auto: "true"
  target:
    kind: Deployment
- patch: |-
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: all
      namespace: jellystat
      annotations:
        reloader.stakater.com/auto: "true"
  target:
    kind: StatefulSet
- patch: |-
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: jellystat
      namespace: jellystat
      annotations:
        gethomepage.dev/href: https://jellystat.crt.house
        gethomepage.dev/enabled: "true"
        gethomepage.dev/description: Media Tracker
        gethomepage.dev/group: Media Management
        gethomepage.dev/icon: jellystat
        gethomepage.dev/name: Jellytat
        gethomepage.dev/pod-selector: ""
  target:
    kind: Ingress

resources:
- resources/deployments.yaml
- resources/external-secrets.yaml
- resources/ingresses.yaml
- resources/namespaces.yaml
- resources/services.yaml
- resources/statefulsets.yaml
